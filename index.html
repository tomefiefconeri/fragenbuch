<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fragenbuch</title>
<meta name="description" content="Toms Buch der kleinen Fragen">
<meta name="theme-color" content="#f4efe4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1a17" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fragenbuch">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f4efe4; --card:#fbf8f1; --ink:#22201b; --muted:#6f685b; --line:#ddd4c2;
  --accent:#b4471f; --accent-ink:#fff; --open:#a87a12; --open-bg:#f6e9c6; --done:#3c6e4f; --done-bg:#dcebdf;
  --shadow:0 1px 0 rgba(0,0,0,.04),0 6px 20px -12px rgba(60,40,10,.25);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1b1a17; --card:#24221e; --ink:#ede6d8; --muted:#a39a89; --line:#3a362f;
    --accent:#e0754a; --accent-ink:#1b1a17; --open:#e2b453; --open-bg:#3b3220; --done:#86c29b; --done-bg:#22352a;
    --shadow:0 1px 0 rgba(0,0,0,.2),0 8px 24px -14px rgba(0,0,0,.6);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.55 "IBM Plex Sans",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-.01em;margin:0}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}

header{padding:28px 0 8px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
header h1{font-size:clamp(30px,7vw,42px);line-height:1}
header h1 em{font-style:italic;font-weight:400;color:var(--accent)}
.stats{font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.stats b{color:var(--ink);font-weight:500}

.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;font-size:14px;font-weight:500;transition:transform .08s,border-color .15s}
.btn:hover{border-color:var(--muted)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.btn.danger{color:#b3261e}

/* capture */
.capture{margin:18px 0 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px 6px 6px 16px;display:flex;gap:8px;align-items:center}
.capture input{flex:1;border:0;background:transparent;outline:none;padding:10px 0;font-family:Fraunces,Georgia,serif;font-size:19px;min-width:0}
@media (max-width:480px){.capture .lbl{display:none}.capture{padding-left:12px}}
.capture input::placeholder{color:var(--muted);font-style:italic}

.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.search{flex:1 1 220px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:transparent}
.search input{flex:1;border:0;background:transparent;outline:none;padding:9px 0;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 12px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--paper)}
.tagbar{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 18px}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;background:transparent;color:var(--muted)}
.chip.on{border-color:var(--accent);color:var(--accent)}

/* list */
.list{display:flex;flex-direction:column;gap:10px;padding-bottom:60px}
.entry{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);cursor:pointer;transition:border-color .15s}
.entry:hover{border-color:var(--muted)}
.entry .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.entry h3{font-size:19px;line-height:1.3;margin:6px 0 0}
.entry .ans{margin:8px 0 0;color:var(--ink);opacity:.85;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.entry.open .ans{display:block;-webkit-line-clamp:unset;opacity:1}
.entry .more{display:none;margin-top:10px;font-size:13px;color:var(--muted)}
.entry.open .more{display:block}
.entry .more a{color:var(--accent);word-break:break-all}
.entry .actions{display:flex;gap:6px;margin-top:10px}
.badge{font-size:11px;padding:2px 8px;border-radius:999px;letter-spacing:.03em;font-weight:500}
.badge.offen{background:var(--open-bg);color:var(--open)}
.badge.beantwortet{background:var(--done-bg);color:var(--done)}
.tag{color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:50px 10px;font-family:Fraunces,serif;font-style:italic;font-size:18px}
mark{background:var(--open-bg);color:inherit;border-radius:3px;padding:0 2px}

/* dialogs */
dialog{border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);padding:0;width:min(640px,calc(100vw - 24px));max-height:calc(100vh - 40px);box-shadow:0 30px 80px -20px rgba(0,0,0,.45)}
dialog::backdrop{background:rgba(20,15,5,.45);backdrop-filter:blur(2px)}
.dlg{padding:22px}
.dlg h2{font-size:22px;margin-bottom:14px}
label{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 4px}
.field{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px;outline:none}
.field:focus{border-color:var(--accent)}
textarea.field{min-height:130px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.row{grid-template-columns:1fr}}
.dlg-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.dlg-foot .spacer{flex:1}

/* random */
.rnd{padding:30px 26px 22px;text-align:left}
.rnd .kicker{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.rnd h2{font-size:clamp(22px,5vw,30px);line-height:1.2;margin:10px 0 14px}
.rnd .reveal{white-space:pre-wrap}
.rnd .src{margin-top:12px;font-size:13px;color:var(--muted)}
.rnd .src a{color:var(--accent);word-break:break-all}

/* auth */
.auth{max-width:380px;margin:12vh auto 0;padding:0 16px}
.auth h1{font-size:44px;line-height:1}
.auth h1 em{font-style:italic;font-weight:400;color:var(--accent)}
.auth p{color:var(--muted);margin:10px 0 20px}
.msg{font-size:14px;margin-top:12px;color:var(--muted)}
.msg.err{color:#b3261e}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
</style>
</head>
<body>

<!-- LOGIN -->
<section id="authView" class="auth hidden">
  <h1>Fragen<em>buch</em></h1>
  <p>Kleine Fragen, festgehalten.</p>
  <form id="authForm">
    <label for="email">E-Mail</label>
    <input class="field" id="email" type="email" autocomplete="email" required>
    <label for="pw">Passwort</label>
    <input class="field" id="pw" type="password" autocomplete="current-password" minlength="6" required>
    <div class="dlg-foot" style="justify-content:flex-start">
      <button class="btn primary" type="submit" id="authBtn">Anmelden</button>
      <button class="btn ghost" type="button" id="authToggle">Konto erstellen</button>
    </div>
    <div class="msg" id="authMsg"></div>
  </form>
</section>

<!-- APP -->
<main id="appView" class="hidden">
  <div class="wrap">
    <header>
      <div>
        <h1>Fragen<em>buch</em></h1>
        <div class="stats mono" id="stats"></div>
      </div>
      <div style="display:flex;gap:6px">
        <button class="btn" id="rndBtn" title="Zufällige Frage">🎲 Zufall</button>
        <button class="btn ghost" id="logoutBtn" title="Abmelden">Abmelden</button>
      </div>
    </header>

    <form class="capture" id="quickForm" autocomplete="off">
      <input id="quickInput" placeholder="Was fragst du dich gerade?" aria-label="Neue Frage">
      <button class="btn ghost" type="button" id="fullBtn" title="Mit allen Feldern anlegen">＋<span class="lbl"> Details</span></button>
      <button class="btn primary" type="submit">Notieren</button>
    </form>

    <div class="toolbar">
      <div class="search">
        <span aria-hidden="true" style="color:var(--muted)">⌕</span>
        <input id="q" type="search" placeholder="Suchen in Fragen, Antworten, Quellen …" aria-label="Suche">
      </div>
      <div class="seg" id="statusSeg">
        <button data-s="alle" class="on">Alle</button>
        <button data-s="offen">Offen</button>
        <button data-s="beantwortet">Beantwortet</button>
      </div>
    </div>
    <div class="tagbar" id="tagbar"></div>

    <div class="list" id="list"></div>
  </div>
</main>

<!-- EDIT -->
<dialog id="editDlg">
  <form class="dlg" id="editForm" method="dialog">
    <h2 id="editTitle">Eintrag</h2>
    <label for="f_frage">Frage</label>
    <input class="field" id="f_frage" required>
    <label for="f_antwort">Antwort</label>
    <textarea class="field" id="f_antwort" placeholder="Was hast du herausgefunden?"></textarea>
    <label for="f_quelle">Quelle(n)</label>
    <input class="field" id="f_quelle" placeholder="Link oder Buch, mehrere mit Komma trennen">
    <div class="row">
      <div>
        <label for="f_tags">Themen / Tags</label>
        <input class="field" id="f_tags" placeholder="z. B. Physik, Natur" list="tagList">
        <datalist id="tagList"></datalist>
      </div>
      <div>
        <label for="f_kontext">Wo kam die Frage auf?</label>
        <input class="field" id="f_kontext" placeholder="z. B. beim Wandern">
      </div>
    </div>
    <div class="row">
      <div>
        <label for="f_datum">Datum</label>
        <input class="field" id="f_datum" type="date" required>
      </div>
      <div>
        <label for="f_status">Status</label>
        <select class="field" id="f_status">
          <option value="offen">offen</option>
          <option value="beantwortet">beantwortet</option>
        </select>
      </div>
    </div>
    <div class="dlg-foot">
      <button class="btn danger ghost" type="button" id="delBtn">Löschen</button>
      <span class="spacer"></span>
      <button class="btn" type="button" id="cancelBtn">Abbrechen</button>
      <button class="btn primary" type="submit" id="saveBtn">Speichern</button>
    </div>
  </form>
</dialog>

<!-- RANDOM -->
<dialog id="rndDlg">
  <div class="rnd">
    <div class="kicker mono" id="rndKicker"></div>
    <h2 id="rndQ"></h2>
    <div id="rndBody"></div>
    <div class="dlg-foot">
      <button class="btn ghost" id="rndClose">Schließen</button>
      <span class="spacer"></span>
      <button class="btn" id="rndReveal">Antwort zeigen</button>
      <button class="btn primary" id="rndNext">🎲 Noch eine</button>
    </div>
  </div>
</dialog>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://dhgstbbagaosivtozbdk.supabase.co";
const SUPABASE_KEY = "sb_publishable_U8ecyihN_24daiwW0_ePkw_eUnyckbD"; // öffentlicher Schlüssel, Daten sind per Row Level Security geschützt
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = s => document.querySelector(s);
const state = { items: [], q: "", status: "alle", tag: null, editing: null, signup: false, lastRnd: null };

const esc = s => (s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => (s ?? "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const fmtDate = d => new Date(d + "T12:00:00").toLocaleDateString("de-DE", { day: "numeric", month: "short", year: "numeric" });
const today = () => new Date().toLocaleDateString("sv-SE");
function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("show"); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("show"),2200); }
function linkify(s){
  return esc(s).replace(/(https?:\/\/[^\s,]+)/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
}
function highlight(text, q){
  const safe = esc(text);
  if(!q) return safe;
  const words = q.trim().split(/\s+/).filter(w => w.length > 1).map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  if(!words.length) return safe;
  return safe.replace(new RegExp(`(${words.join("|")})`, "gi"), "<mark>$1</mark>");
}

/* ---------- Auth ---------- */
async function initAuth(){
  const { data: { session } } = await sb.auth.getSession();
  render(session);
  sb.auth.onAuthStateChange((_e, s) => render(s));
}
function render(session){
  $("#authView").classList.toggle("hidden", !!session);
  $("#appView").classList.toggle("hidden", !session);
  if(session) load();
}
$("#authToggle").onclick = () => {
  state.signup = !state.signup;
  $("#authBtn").textContent = state.signup ? "Konto erstellen" : "Anmelden";
  $("#authToggle").textContent = state.signup ? "Ich habe schon ein Konto" : "Konto erstellen";
  $("#pw").autocomplete = state.signup ? "new-password" : "current-password";
  $("#authMsg").textContent = "";
};
$("#authForm").onsubmit = async e => {
  e.preventDefault();
  const email = $("#email").value.trim(), password = $("#pw").value;
  const msg = $("#authMsg"); msg.className = "msg"; msg.textContent = "…";
  const { data, error } = state.signup
    ? await sb.auth.signUp({ email, password, options: { emailRedirectTo: location.href.split("#")[0] } })
    : await sb.auth.signInWithPassword({ email, password });
  if(error){ msg.className = "msg err"; msg.textContent = error.message === "Invalid login credentials" ? "E-Mail oder Passwort falsch." : error.message; return; }
  if(state.signup && !data.session){ msg.textContent = "Fast geschafft: Bestätige den Link in der E-Mail, dann hier anmelden."; }
};
$("#logoutBtn").onclick = () => sb.auth.signOut();

/* ---------- Daten ---------- */
async function load(){
  const { data, error } = await sb.from("fragen")
    .select("id,frage,antwort,quelle,tags,datum,kontext,status,created_at")
    .order("datum", { ascending: false }).order("created_at", { ascending: false });
  if(error){ toast("Laden fehlgeschlagen: " + error.message); return; }
  state.items = data;
  draw();
}

function filtered(){
  const words = norm(state.q).split(/\s+/).filter(Boolean);
  return state.items.filter(it => {
    if(state.status !== "alle" && it.status !== state.status) return false;
    if(state.tag && !(it.tags || []).includes(state.tag)) return false;
    if(!words.length) return true;
    const hay = norm([it.frage, it.antwort, it.quelle, it.kontext, (it.tags||[]).join(" ")].join(" "));
    return words.every(w => hay.includes(w));
  });
}

function allTags(){
  const m = new Map();
  state.items.forEach(it => (it.tags || []).forEach(t => m.set(t, (m.get(t) || 0) + 1)));
  return [...m.entries()].sort((a,b) => b[1]-a[1] || a[0].localeCompare(b[0]));
}

function draw(){
  const total = state.items.length, offen = state.items.filter(i => i.status === "offen").length;
  $("#stats").innerHTML = `<b>${total}</b> Fragen · <b>${offen}</b> offen · <b>${total-offen}</b> beantwortet`;

  const tags = allTags();
  $("#tagList").innerHTML = tags.map(([t]) => `<option value="${esc(t)}">`).join("");
  $("#tagbar").innerHTML = tags.map(([t,n]) =>
    `<button class="chip ${state.tag===t?"on":""}" data-tag="${esc(t)}">#${esc(t)} <span class="mono">${n}</span></button>`).join("");

  const list = filtered();
  if(!list.length){
    $("#list").innerHTML = `<div class="empty">${total ? "Nichts gefunden." : "Noch leer. Die erste Frage wartet schon irgendwo."}</div>`;
    return;
  }
  $("#list").innerHTML = list.map(it => `
    <article class="entry" data-id="${it.id}">
      <div class="meta mono">
        <span class="badge ${it.status}">${it.status}</span>
        <span>${fmtDate(it.datum)}</span>
        ${it.kontext ? `<span>· ${esc(it.kontext)}</span>` : ""}
        ${(it.tags||[]).map(t => `<span class="tag">#${esc(t)}</span>`).join("")}
      </div>
      <h3>${highlight(it.frage, state.q)}</h3>
      ${it.antwort ? `<p class="ans">${highlight(it.antwort, state.q)}</p>` : ""}
      <div class="more">
        ${it.quelle ? `<div><b>Quelle:</b> ${linkify(it.quelle)}</div>` : ""}
        <div class="actions">
          <button class="btn" data-edit="${it.id}">${it.status === "offen" ? "Antwort eintragen" : "Bearbeiten"}</button>
        </div>
      </div>
    </article>`).join("");
}

/* ---------- Interaktion ---------- */
let qTimer;
$("#q").oninput = e => { clearTimeout(qTimer); qTimer = setTimeout(() => { state.q = e.target.value; draw(); }, 120); };
$("#statusSeg").onclick = e => {
  const b = e.target.closest("button"); if(!b) return;
  state.status = b.dataset.s;
  document.querySelectorAll("#statusSeg button").forEach(x => x.classList.toggle("on", x === b));
  draw();
};
$("#tagbar").onclick = e => {
  const b = e.target.closest(".chip"); if(!b) return;
  state.tag = state.tag === b.dataset.tag ? null : b.dataset.tag; draw();
};
$("#list").onclick = e => {
  const ed = e.target.closest("[data-edit]");
  if(ed){ e.stopPropagation(); openEdit(state.items.find(i => i.id === ed.dataset.edit)); return; }
  if(e.target.closest("a")) return;
  const card = e.target.closest(".entry"); if(card) card.classList.toggle("open");
};

$("#quickForm").onsubmit = async e => {
  e.preventDefault();
  const frage = $("#quickInput").value.trim(); if(!frage) return;
  const { data, error } = await sb.from("fragen").insert({ frage, datum: today() }).select().single();
  if(error){ toast("Speichern fehlgeschlagen: " + error.message); return; }
  $("#quickInput").value = "";
  state.items.unshift(data); draw();
  toast("Notiert ✓");
};

/* ---------- Bearbeiten ---------- */
function openEdit(it){
  state.editing = it || null;
  $("#editTitle").textContent = it ? "Eintrag bearbeiten" : "Neue Frage";
  $("#f_frage").value = it?.frage || $("#quickInput").value.trim();
  $("#f_antwort").value = it?.antwort || "";
  $("#f_quelle").value = it?.quelle || "";
  $("#f_tags").value = (it?.tags || []).join(", ");
  $("#f_kontext").value = it?.kontext || "";
  $("#f_datum").value = it?.datum || today();
  $("#f_status").value = it?.status || "offen";
  $("#delBtn").classList.toggle("hidden", !it);
  $("#editDlg").showModal();
}
$("#f_antwort").oninput = () => { if($("#f_antwort").value.trim() && $("#f_status").value === "offen" && !$("#f_antwort")._touched){ $("#f_status").value = "beantwortet"; } };
$("#f_status").onchange = () => { $("#f_antwort")._touched = true; };
$("#cancelBtn").onclick = () => $("#editDlg").close();
$("#editForm").onsubmit = async e => {
  e.preventDefault();
  const row = {
    frage: $("#f_frage").value.trim(),
    antwort: $("#f_antwort").value.trim() || null,
    quelle: $("#f_quelle").value.trim() || null,
    tags: [...new Set($("#f_tags").value.split(",").map(t => t.trim()).filter(Boolean))],
    kontext: $("#f_kontext").value.trim() || null,
    datum: $("#f_datum").value,
    status: $("#f_status").value,
  };
  const q = state.editing
    ? sb.from("fragen").update(row).eq("id", state.editing.id).select().single()
    : sb.from("fragen").insert(row).select().single();
  const { data, error } = await q;
  if(error){ toast("Fehler: " + error.message); return; }
  if(state.editing) Object.assign(state.editing, data); else { state.items.unshift(data); $("#quickInput").value = ""; }
  $("#f_antwort")._touched = false;
  $("#editDlg").close(); draw(); toast("Gespeichert ✓");
};
$("#delBtn").onclick = async () => {
  if(!state.editing) return;
  const btn = $("#delBtn");
  if(!btn._armed){ btn._armed = true; btn.textContent = "Wirklich löschen?"; setTimeout(() => { btn._armed = false; btn.textContent = "Löschen"; }, 3000); return; }
  btn._armed = false; btn.textContent = "Löschen";
  const { error } = await sb.from("fragen").delete().eq("id", state.editing.id);
  if(error){ toast("Fehler: " + error.message); return; }
  state.items = state.items.filter(i => i !== state.editing);
  $("#editDlg").close(); draw(); toast("Gelöscht");
};
document.querySelectorAll("dialog").forEach(d => d.addEventListener("click", e => { if(e.target === d) d.close(); }));

/* ---------- Zufall ---------- */
function showRandom(){
  const pool = filtered().length ? filtered() : state.items;
  if(!pool.length){ toast("Noch keine Fragen im Buch"); return; }
  let it = pool[Math.floor(Math.random() * pool.length)];
  if(pool.length > 1 && it === state.lastRnd) it = pool[(pool.indexOf(it) + 1) % pool.length];
  state.lastRnd = it;
  $("#rndKicker").textContent = `${fmtDate(it.datum)}${it.kontext ? " · " + it.kontext : ""}${(it.tags||[]).length ? " · #" + it.tags.join(" #") : ""}`;
  $("#rndQ").textContent = it.frage;
  const has = !!it.antwort;
  $("#rndBody").innerHTML = has
    ? `<div class="reveal hidden" id="rndAns">${esc(it.antwort)}${it.quelle ? `<div class="src">Quelle: ${linkify(it.quelle)}</div>` : ""}</div>`
    : `<p class="msg">Noch offen. Lust, sie jetzt zu beantworten?</p>`;
  $("#rndReveal").textContent = has ? "Antwort zeigen" : "Beantworten";
  $("#rndReveal").classList.remove("hidden");
  $("#rndReveal").onclick = () => {
    if(has){ $("#rndAns").classList.remove("hidden"); $("#rndReveal").classList.add("hidden"); }
    else { $("#rndDlg").close(); openEdit(it); }
  };
  if(!$("#rndDlg").open) $("#rndDlg").showModal();
}
$("#fullBtn").onclick = () => openEdit(null);
$("#rndBtn").onclick = showRandom;
$("#rndNext").onclick = showRandom;
$("#rndClose").onclick = () => $("#rndDlg").close();

document.addEventListener("keydown", e => {
  if(e.key === "/" && !/INPUT|TEXTAREA/.test(document.activeElement.tagName) && !document.querySelector("dialog[open]")){ e.preventDefault(); $("#q").focus(); }
});

initAuth();
</script>
